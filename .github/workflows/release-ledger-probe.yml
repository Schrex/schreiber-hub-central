name: Release ledger permission probe
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: production-frontend
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Verify Actions token by writing non-production diagnostic metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ledger-probe.mjs
      - name: Retain probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledger-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-ledger-probe/
          if-no-files-found: ignore
          retention-days: 90
