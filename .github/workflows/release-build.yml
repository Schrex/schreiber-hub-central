name: Release build only

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character current main SHA approved for build-only validation
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Shared lane reserved for future production/recovery. Serialization is not FIFO;
# the guard also refuses stale main commits. No upload exists in this version.
concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Require exact successful main verification
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit }}
        run: node scripts/release-guard.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Build with synthetic public configuration (never upload)
        env:
          RELEASE_SHA: ${{ inputs.commit }}
          VERIFICATION_URL: ${{ steps.guard.outputs.verification_url }}
        run: node scripts/release-dry-run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NOT-FOR-DEPLOYMENT-${{ inputs.commit }}-${{ github.run_id }}
          path: dist/release-dry-run/
          if-no-files-found: error
          retention-days: 14
