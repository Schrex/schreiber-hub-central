name: Verification

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [app, backend, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use tested npm version
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci
      - name: Build disposable backend from migrations and synthetic seed
        if: matrix.group == 'backend'
        run: npm run local:start
      - name: Run verification
        run: npm run verify:${{ matrix.group }}
      - name: Stop disposable backend
        if: always() && matrix.group == 'backend'
        run: npm run local:stop
