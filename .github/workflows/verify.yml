name: Verification

on:
  pull_request:
  push:
    branches: [main, develop, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [app, backend, lint, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build disposable backend from migrations and synthetic seed
        if: matrix.group == 'backend'
        run: bun run local:start
      - name: Run verification
        run: bun run verify:${{ matrix.group }}
      - name: Stop disposable backend
        if: always() && matrix.group == 'backend'
        run: bun run local:stop
