name: Verification

on:
  pull_request:
  # PRs into develop already test the merge result, so develop pushes are not
  # re-verified. Main pushes stay: release-guard.mjs requires a push run per main SHA.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.group }}
    # The develop -> main release PR repeats the checks its PRs into develop ran;
    # the main push run after merge is the release evidence.
    if: github.event_name != 'pull_request' || github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [app, backend, lint, edge, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 120s bun install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::Locked dependency install attempt $attempt failed or timed out."
          done
          echo "::error::Locked dependency installation failed twice; verification did not run."
          exit 1
      - name: Build disposable backend from migrations and synthetic seed
        if: matrix.group == 'backend' || matrix.group == 'browser'
        # Same as local:start, minus containers no check uses (dashboards, mail capture,
        # image transforms, logging, pooler). Image pulls dominate this step.
        run: |
          bun run local:prepare
          npx --yes supabase@2.121.0 start --workdir .local-backend \
            -x studio,postgres-meta,mailpit,imgproxy,logflare,vector,supavisor
      - name: Configure bounded Ubuntu package downloads
        if: matrix.group == 'browser'
        run: |
          # The Azure mirror stalled fetching fonts in run 39833516006.
          # Change only that mirror on this disposable hosted runner.
          sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' -o -name 'apt-mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts
      - name: Restore Playwright browser cache
        if: matrix.group == 'browser'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium for browser test
        if: matrix.group == 'browser'
        timeout-minutes: 7
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          set +e
          timeout --kill-after=15s 360s node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "::error::Chromium dependency installation failed (exit $result). Check apt/CDN output above; acceptance tests have not run."
            df -h / /tmp
            node node_modules/@playwright/test/cli.js --version
          fi
          exit "$result"
      - name: Run verification
        run: bun run verify:${{ matrix.group }}
      # No backend stop step: the hosted runner and its containers are discarded.
